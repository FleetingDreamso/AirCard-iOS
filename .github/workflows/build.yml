name: Build AirCard-iOS

# 只做打包，不编译 Rust、不装 cmake、不装 xcodegen。
# AirliftFFI.xcframework 与 AirCard-iOS.xcodeproj 已随仓库提供，克隆下来即可直接 xcodebuild。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# 打标签时创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: Build iOS App
    # macos-latest 自带 Xcode 16+，满足 iOS 18 部署目标。
    # 如需可复现的固定环境，可改成 macos-15。
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make build script executable
        run: chmod +x ./build-ipa.sh

      - name: Build AirCard-iOS (Unsigned)
        run: ./build-ipa.sh Release

      # 确认中文文案真的编进了可执行文件，防止汉化被覆盖回英文
      - name: Verify Chinese strings
        run: |
          BIN="$(find build/DerivedData/Build/Products -type f -name 'AirCard-iOS' -path '*.app/*' | head -n 1)"
          for KW in 配对 钱包卡片 密码主题 刷入 活动日志; do
            LC_ALL=C grep -aq "$KW" "$BIN" || { echo "::error::产物中缺少中文文案「$KW」"; exit 1; }
          done
          echo "中文文案校验通过"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS
          path: build/AirCard-iOS.ipa
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/AirCard-iOS.ipa
          generate_release_notes: true

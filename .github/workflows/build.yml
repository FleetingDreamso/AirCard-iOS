name: Build AirCard-iOS

# 先编译 rust-core 生成 AirliftFFI.xcframework，再打包 IPA。
# 必须编译 Rust：Swift 侧引用的 FFI 符号（如 al_exploit_scan_descriptors）只存在于
# 重新构建的静态库里，用仓库里的旧框架会报 "cannot find ... in scope"。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# 打标签时创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: Build iOS App
    # macos-latest 自带 Xcode 16+，满足 iOS 18 部署目标。
    # 如需可复现的固定环境，可改成 macos-15。
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cmake
        run: brew install cmake

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Make build scripts executable
        run: chmod +x ./build-ios.sh ./build-ipa.sh

      - name: Build Rust FFI framework
        run: |
          # build-ios.sh 默认找 Xcode-beta.app，runner 上没有，这里显式指向当前选中的 Xcode
          export DEVELOPER_DIR="$(xcode-select -p)"
          ./build-ios.sh

      - name: Build AirCard-iOS (Unsigned)
        run: ./build-ipa.sh Release

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS
          path: build/AirCard-iOS.ipa
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/AirCard-iOS.ipa
          generate_release_notes: true
